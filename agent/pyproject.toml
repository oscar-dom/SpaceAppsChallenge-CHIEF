[project]
name = "chief-agent"
version = "0.1.0"
description = "CHIEF: the AI assistant of the CHIEF crew health system"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
